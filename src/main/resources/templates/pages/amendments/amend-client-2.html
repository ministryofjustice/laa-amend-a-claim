<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(
        title=#{amendments.title},
        mainContent=~{::#main-content},
        pageCategory=${null},
        showBackLink=${true}
    )}">
<body>
<main class="govuk-main-wrapper" id="main-content">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-full">

      <form method="post"
            th:action="@{/submissions/{submissionId}/claims/{claimId}/amendments/amend-client-two(submissionId=${submissionId}, claimId=${claimId})}"
            th:object="${client2Form}"
            th:with="formErrors=${@ThymeleafUtils.orEmpty(client2FormErrors)}">

        <th:block th:replace="~{fragments/amendments-assessed-banner :: assessedBanner}"></th:block>
        <th:block th:replace="~{fragments/error-summary :: error-summary(${formErrors})}"></th:block>

        <h1 class="govuk-heading-l">
          <span th:text="#{amendments.title}"></span>
        </h1>

        <h2 class="govuk-heading-m" th:text="#{claimDetails.clientHeading}"></h2>


        <div class="govuk-summary-card">
          <div class="govuk-summary-card__title-wrapper">
            <h2 class="govuk-summary-card__title"
                th:text="#{claimClient.client2Details}">
            </h2>
          </div>
          <div class="govuk-summary-card__content">
            <dl class="govuk-summary-list">

              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{amendments.item}"></dt>
                <dd class="govuk-summary-list__value govuk-!-font-weight-bold"
                    th:text="#{amendments.current}"></dd>
                <dd class="govuk-summary-list__value govuk-!-font-weight-bold"
                    th:text="#{amendments.amended}"></dd>
              </div>

              <div class="govuk-summary-list__row"
                   th:each="entry : ${clientView.client2Rows}">
                <dt class="govuk-summary-list__key"
                    th:text="#{${'claimClient.rows.' + entry.key.name()}}"></dt>
                <dd class="govuk-summary-list__value"
                    th:text="${@ThymeleafUtils.getFormattedValue(entry.key, entry.value).resolve(#messages)}"></dd>
                <dd class="govuk-summary-list__value">
                  <th:block
                      th:replace="~{fragments/amendments/amendment-input :: amendmentInput(${entry.key}, ${'claimClient.rows.' + entry.key.name()}, ${formErrors})}"></th:block>
                </dd>
              </div>
            </dl>
          </div>
        </div>

        <div class="govuk-button-group">
          <button class="govuk-button" type="submit" th:text="#{amendments.continue}"></button>
          <a th:href="@{/submissions/{submissionId}/claims/{claimId}/amendments/client(submissionId=${submissionId}, claimId=${claimId})}"
             id="cancel"
             class="govuk-link govuk-link--no-visited-state"
             th:text="#{service.cancel}">
          </a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
