<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(
        title=#{amendments.title},
        mainContent=~{::#main-content},
        pageCategory=${null},
        showBackLink=${false}
    )}">
<body>
<main class="govuk-main-wrapper" id="main-content">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-full"
         th:with="originalCostsForm=${forms.getCostsForm().getOriginal()},
                  costsForm=${forms.getCostsForm().getCurrent()}">
      <th:block th:replace="~{partials/amendments-view-header :: viewHeader(currentPage='costs')}"></th:block>

      <h2 class="govuk-heading-m" th:text="#{claimDetails.costsHeading}"></h2>

      <div class="govuk-summary-card">
        <div class="govuk-summary-card__title-wrapper">
          <h2 class="govuk-summary-card__title" th:text="#{claimCosts.listOfCosts}"></h2>
          <ul class="govuk-summary-card__actions">
            <li class="govuk-summary-card__action">
              <a class="govuk-link"
                 id="amend-costs-link"
                 th:href="@{/submissions/{submissionId}/claims/{claimId}/amendments/amend-costs(submissionId=${submissionId}, claimId=${claimId})}"
                 th:text="#{amendments.change}"></a>
            </li>
          </ul>
        </div>
        <div class="govuk-summary-card__content">
          <dl class="govuk-summary-list">
            <div class="govuk-summary-list__row">
              <dt class="govuk-summary-list__key" th:text="#{amendments.item}"></dt>
              <dd class="govuk-summary-list__value govuk-!-font-weight-bold" th:text="#{claimCosts.submitted}"></dd>
              <dd class="govuk-summary-list__value govuk-!-font-weight-bold" th:text="#{claimCosts.calculated}"></dd>
              <dd class="govuk-summary-list__value govuk-!-font-weight-bold"
                  th:if="${costsFormIsAmended}"
                  th:text="#{amendments.amended}"></dd>
            </div>

            <div class="govuk-summary-list__row"
                 th:each="entry : ${costFields}"
                 th:with="field=${entry.key}, row=${entry.value}">
              <dt class="govuk-summary-list__key" th:text="#{${'claimCosts.rows.' + field.name()}}"></dt>
              <dd class="govuk-summary-list__value" th:text="${@ThymeleafUtils.getFormattedValue(row.submitted).resolve(#messages)}"></dd>
              <dd class="govuk-summary-list__value"
                  th:text="${@ThymeleafUtils.getFormattedValue(row.calculated).resolve(#messages)}"></dd>
              <dd class="govuk-summary-list__value"
                  th:if="${costsFormIsAmended}"
                  th:text="${costsForm.isAmendment(field.name(), originalCostsForm, field.type) ? @ThymeleafUtils.getFormattedValue(costsForm.getAmendedValue(field)).resolve(#messages) : ''}"></dd>
            </div>
          </dl>
        </div>
      </div>

      <th:block th:replace="~{partials/amendments-view-footer :: viewFooter()}"></th:block>
    </div>
  </div>
</main>
</body>
</html>
