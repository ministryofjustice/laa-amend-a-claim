<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="amendmentInput(field, labelMessageKey)">
  <th:block th:if="${field.type.name() == 'DATE'}">
    <th:block th:replace="~{partials/amendments/date-input :: amendmentDateInput(${field.inputKey()})}"></th:block>
  </th:block>
  <th:block th:if="${field.type.name() == 'BOOLEAN'}">
    <th:block th:replace="~{partials/amendments/boolean-input :: amendmentBooleanInput(${field.inputKey()}, ${labelMessageKey})}"></th:block>
  </th:block>
  <th:block th:if="${field.type.name() == 'ENUM'}">
    <th:block th:replace="~{partials/amendments/enum-input :: amendmentEnumInput(${field}, ${labelMessageKey})}"></th:block>
  </th:block>
  <th:block th:if="${field.type.name() == 'BIG_DECIMAL'}">
    <th:block th:replace="~{partials/amendments/big-decimal-input :: amendmentBigDecimalInput(${field.inputKey()}, ${labelMessageKey})}"></th:block>
  </th:block>
  <th:block th:if="${field.type.name() == 'NUMBER'}">
    <th:block th:replace="~{partials/amendments/number-input :: amendmentNumberInput(${field.name()}, ${labelMessageKey})}"></th:block>
  </th:block>
  <input th:if="${field.type.name() == 'TEXT'}"
         class="govuk-input"
         type="text"
         th:field="*{inputs[__${field.inputKey()}__]}" />
</th:block>
<th:block th:fragment="amendmentInputForType(fieldKey, fieldTypeName, labelMessageKey)">
  <th:block th:if="${fieldTypeName == 'BIG_DECIMAL'}">
    <th:block th:replace="~{partials/amendments/big-decimal-input :: amendmentBigDecimalInput(${fieldKey}, ${labelMessageKey})}"></th:block>
  </th:block>
  <th:block th:if="${fieldTypeName == 'BOOLEAN'}">
    <th:block th:replace="~{partials/amendments/boolean-input :: amendmentBooleanInput(${fieldKey}, ${labelMessageKey})}"></th:block>
  </th:block>
  <input th:if="${fieldTypeName == 'TEXT'}"
         class="govuk-input"
         type="text"
         th:field="*{inputs[__${fieldKey}__]}" />
</th:block>
</body>
</html>
