<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="amendmentNumberInput(fieldKey, labelMessageKey, formErrors)"
          th:with="label=${#messages.msgOrNull(labelMessageKey) ?: fieldKey}">
  <label class="govuk-label govuk-visually-hidden"
         th:for="${fieldKey}"
         th:text="${label}"></label>
  <th:block th:replace="~{fragments/amendments/field-error :: fieldError(${fieldKey}, ${formErrors})}"></th:block>
  <input class="govuk-input govuk-input--width-5"
         th:classappend="${@ThymeleafUtils.hasAmendmentFieldError(formErrors, fieldKey) ? 'govuk-input--error' : ''}"
         type="text"
         inputmode="numeric"
         spellcheck="false"
         th:id="${fieldKey}"
         th:field="*{inputs[__${fieldKey}__]}" />
</th:block>
</body>
</html>
