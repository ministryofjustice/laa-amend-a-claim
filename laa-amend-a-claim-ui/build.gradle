plugins {
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.0.3'
    id "com.diffplug.spotless" version "8.10.1"
    id "io.sentry.jvm.gradle" version "6.20.0"
    id 'au.com.dius.pact' version '4.7.5'
}

def frontendResourcesDir = layout.projectDirectory.dir('src/main/resources/static')

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

checkstyle {
    toolVersion = '13.4.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

spotless {
    java {
        target 'src/**/java/**/*.java'
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}


dependencyManagement {
    dependencies {
        // === INSERT YOUR OVERRIDES HERE ===
    }
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'

    // API models
    implementation 'uk.gov.justice.laa.datastewardship.payments:data-claims-api-models:1.20.0'
    implementation 'uk.gov.justice.laadata.providers:providers-api:1.23.0'

    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.mapstruct:mapstruct:1.6.3'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.webjars.npm:govuk-frontend:6.4.0'
    implementation 'org.webjars.npm:ministryofjustice__frontend:10.0.1'
    implementation 'org.webjars.npm:accessible-autocomplete:3.0.1'
    implementation("org.apache.commons:commons-csv:1.14.1")

    implementation("io.vavr:vavr:1.0.1")

    // Sentry observability for Spring Boot 4
    implementation enforcedPlatform('io.sentry:sentry-bom:8.54.0')
    implementation 'io.sentry:sentry-spring-boot-4'

    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    // Pact consumer testing
    testImplementation 'au.com.dius.pact.consumer:junit5:4.7.5'
    // test dependencies
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock:5.0.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jackson-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.jmockit:jmockit:1.50'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jsoup:jsoup:1.23.2'
    testImplementation 'com.github.codemonstur:embedded-redis:1.4.4'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.register('checkstyleAll') {
    group = 'verification'
    description = 'Runs checkstyleMain, checkstyleTest, and checkstyleIntegrationTest.'
    dependsOn tasks.matching { it.name in ['checkstyleMain', 'checkstyleTest', 'checkstyleIntegrationTest'] }
}

tasks.named('build') {
    dependsOn tasks.named('checkstyleAll')
}

// Pact consumer test source set
sourceSets {
    pactTest {
        java.srcDir file('src/pactTest/java')
        resources.srcDir file('src/pactTest/resources')
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

configurations {
    pactTestImplementation.extendsFrom testImplementation
    pactTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('pactTest', Test) {
    systemProperty "pact.content_type.override.application/json", "application/json;charset=utf-8"
    description = 'Runs the pact tests.'
    group = 'verification'

    def pactsDir = layout.buildDirectory.dir("pacts").get().asFile
    doFirst {
        if (pactsDir.exists()) {
            pactsDir.deleteDir()
        }
    }

    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'pact.rootDir', layout.buildDirectory.dir("pacts").get().asFile.path
}

tasks.named('processPactTestResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

pact {
    publish {
        pactBrokerUrl = System.getenv('PACT_BROKER_URL') ?: 'https://laa-data-pact-broker.apps.live.cloud-platform.service.justice.gov.uk/'
        pactBrokerUsername = System.getenv('PACT_BROKER_USERNAME') ?: 'ABC'
        pactBrokerPassword = System.getenv('PACT_BROKER_PASSWORD') ?: 'ABC'
        pactDirectory = layout.buildDirectory.dir("pacts").get().asFile.path
        consumerVersion = providers.environmentVariable('GIT_SHA').getOrElse('1.0.0')
        consumerBranch = providers.environmentVariable('GIT_BRANCH').getOrElse('main')
        tags = [providers.environmentVariable('GIT_BRANCH').getOrElse('main')]
    }
}


def npmExecutable = providers.exec {
    commandLine 'bash', '-lc', 'which npm'
}.standardOutput.asText.map { it.trim() }.getOrElse('npm')

tasks.register('npmInstall', Exec) {
    group = 'build setup'
    description = 'Installs Node dependencies for frontend asset compilation.'
    workingDir = projectDir
    inputs.files('package.json', 'package-lock.json')
    outputs.dir(layout.projectDirectory.dir('node_modules'))
    commandLine npmExecutable, 'i', '--no-audit', '--no-fund'
}

tasks.register('compileFEAssets', Exec) {
    group = 'build'
    description = 'Compiles application frontend assets with gulp.'
    workingDir = projectDir
    dependsOn tasks.named('npmInstall')
    inputs.files('gulpfile.ts', 'package.json', 'package-lock.json')
    commandLine npmExecutable, 'run', 'gulp'
}


tasks.register('watch', Exec) {
    group = 'build'
    description = 'Compiles application frontend assets with gulp.'
    workingDir = projectDir
    dependsOn tasks.named('npmInstall')
    inputs.files('gulpfile.ts', 'package.json', 'package-lock.json')
    commandLine npmExecutable, 'run', 'gulp', 'watch'
}

processResources.dependsOn compileFEAssets
processResources
        { from(layout.buildDirectory.dir("generatedFEAssets")) }