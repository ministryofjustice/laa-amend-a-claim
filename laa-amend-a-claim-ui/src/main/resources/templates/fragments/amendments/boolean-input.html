<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="amendmentBooleanInput(field, labelMessageKey, formErrors, areaOfLaw)"
          th:with="fieldKey=${field.name()},
                   label=${#messages.msgOrNull(labelMessageKey) ?: fieldKey}">
  <label class="govuk-label govuk-visually-hidden"
         th:for="${fieldKey}"
         th:text="${label}"></label>
  <th:block th:replace="~{fragments/amendments/field-error :: fieldError(${fieldKey}, ${formErrors})}"></th:block>
  <select class="govuk-select"
          th:classappend="${@ThymeleafUtils.hasAmendmentFieldError(formErrors, fieldKey) ? 'govuk-select--error' : ''}"
          th:id="${fieldKey}"
          th:field="*{inputs[__${fieldKey}__]}">
    <option th:if="${@ThymeleafUtils.isMandatoryFor(field, areaOfLaw)}" value="" hidden></option>
    <option th:unless="${@ThymeleafUtils.isMandatoryFor(field, areaOfLaw)}"
            value=""
            th:text="#{service.noData}"></option>
    <option value="true" th:text="#{service.yes}"></option>
    <option value="false" th:text="#{service.no}"></option>
  </select>
</th:block>
</body>
</html>
