<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(
        title=#{claimSummary.title},
        mainContent=~{::#main-content},
        pageCategory=${null},
        showBackLink=${false}
    )}">
<body>
<main class="govuk-main-wrapper" id="main-content">
    <div class="govuk-grid-row">
        <div class="govuk-grid-column-full">
            <th:block th:replace="~{fragments/claim-details-header :: claimDetailsHeader(currentPage='history')}"></th:block>

            <h2 class="govuk-heading-m" th:text="#{claimDetails.claimHistoryHeading}"></h2>

            <div class="moj-timeline">
                <div class="moj-timeline__item" th:each="event : ${events}">
                    <div class="moj-timeline__header">
                        <h2 class="moj-timeline__title" th:text="${event.type().resolve(#messages)}"></h2>
                        <p class="moj-timeline__byline" th:text="${event.user().resolve(#messages)}"></p>
                    </div>
                    <p class="moj-timeline__date">
                        <time th:datetime="${event.eventDateTime().toInstant().toString()}"
                              th:text="${@ThymeleafUtils.getFormattedValue(event.eventDateTime).resolve(#messages)}"></time>
                    </p>
                    <div class="moj-timeline__description" th:if="${event.amendmentEvent}">
                        <p>
                            <strong th:text="#{claimHistory.claimAmended.requested}"></strong>
                            <span th:text="|by ${event.amendmentRequestedBy.resolve(#messages)}|"></span>
                        </p>
                        <p>
                            <strong th:text="#{claimHistory.claimAmended.reason}"></strong>
                            <span th:text="${event.amendmentReason.resolve(#messages)}"></span>
                        </p>
                        <p th:text="#{claimHistory.claimAmended.fieldsIntro}"></p>
                        <ul class="govuk-list govuk-list--bullet">
                            <li th:each="change : ${event.amendmentChanges}"
                                th:text="#{claimHistory.claimAmended.change(${change.fieldLabel.resolve(#messages)}, ${@ThymeleafUtils.getFormattedValue(change.field, change.before).resolve(#messages)}, ${@ThymeleafUtils.getFormattedValue(change.field, change.after).resolve(#messages)})}"></li>
                        </ul>
                    </div>
                    <div class="moj-timeline__description" th:if="${event.fspEvent}">
                        <p th:if="${event.fspTotalChangedDescription != null}"
                           th:text="${event.fspTotalChangedDescription.resolve(#messages)}"></p>
                        <th:block th:if="${not #lists.isEmpty(event.fspRecalculatedChanges)}">
                            <p th:text="#{claimHistory.claimFspRecalculated.fieldsIntro}"></p>
                            <ul class="govuk-list govuk-list--bullet">
                                <li th:each="change : ${event.fspRecalculatedChanges}"
                                    th:text="#{claimHistory.claimFspRecalculated.change(${change.fieldLabel.resolve(#messages)}, ${@ThymeleafUtils.getFormattedValue(change.field, change.before).resolve(#messages)}, ${@ThymeleafUtils.getFormattedValue(change.field, change.after).resolve(#messages)})}"></li>
                            </ul>
                        </th:block>
                    </div>
                    <div class="moj-timeline__description" th:unless="${event.amendmentEvent or event.fspEvent}">
                        <p th:each="description : ${event.descriptions}" th:text="${description.resolve(#messages)}"></p>
                    </div>
                </div>
            </div>

            <th:block th:replace="~{fragments/claim-details-footer :: claimDetailsFooter()}"></th:block>
        </div>
    </div>
</main>
</body>
</html>
