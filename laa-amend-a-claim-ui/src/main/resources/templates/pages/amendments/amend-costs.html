<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(
        title=#{amendments.title},
        mainContent=~{::#main-content},
        pageCategory=${null},
        showBackLink=${true}
    )}">
<body>
<main class="govuk-main-wrapper" id="main-content">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-full">

      <h1 class="govuk-heading-l">
        <span th:text="#{amendments.title}"></span>
      </h1>

      <h2 class="govuk-heading-m" th:text="#{claimDetails.costsHeading}"></h2>

      <form method="post"
            th:action="@{/submissions/{submissionId}/claims/{claimId}/amendments/amend-costs(submissionId=${submissionId}, claimId=${claimId})}"
            th:object="${costsForm}"
            th:with="formErrors=${@ThymeleafUtils.orEmpty(costFormErrors)}">

        <th:block th:replace="~{fragments/amendments-assessed-banner :: assessedBanner}"></th:block>
        <th:block th:replace="~{fragments/error-summary :: error-summary(${formErrors})}"></th:block>

        <div class="govuk-summary-card">
          <div class="govuk-summary-card__title-wrapper">
            <h2 class="govuk-summary-card__title"
                th:text="#{claimCosts.listOfCosts}">
            </h2>
          </div>
          <div class="govuk-summary-card__content">
            <dl class="govuk-summary-list">

              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{amendments.item}"></dt>
                <dd class="govuk-summary-list__value govuk-!-font-weight-bold" th:text="#{claimCosts.submitted}"></dd>
                <dd class="govuk-summary-list__value govuk-!-font-weight-bold" th:text="#{amendments.amended}"></dd>
              </div>

              <div class="govuk-summary-list__row"
                   th:each="entry : ${costFields}"
                   th:with="field=${entry.key}, row=${entry.value}">
                <dt class="govuk-summary-list__key" th:text="#{${'claimField.' + field.name()}}"></dt>
                <dd class="govuk-summary-list__value" th:text="${@ThymeleafUtils.getFormattedValue(row.submitted).resolve(#messages)}"></dd>
                <dd class="govuk-summary-list__value">
                  <th:block th:if="${field.isEditable(claimIsAssessed)}">
                    <th:block th:replace="~{fragments/amendments/amendment-input :: amendmentInput(${field}, ${'claimField.' + field.name()}, ${formErrors})}"></th:block>
                  </th:block>
                </dd>
              </div>
            </dl>
          </div>
        </div>

        <div class="govuk-button-group">
          <button class="govuk-button" type="submit" th:text="#{amendments.continue}"></button>
          <a th:href="@{/submissions/{submissionId}/claims/{claimId}/amendments/costs(submissionId=${submissionId}, claimId=${claimId})}"
             id="cancel"
             class="govuk-link govuk-link--no-visited-state"
             th:text="#{service.cancel}">
          </a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
