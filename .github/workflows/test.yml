name: Test

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: main
      environment:
        required: true
        type: string
      test_type:
        required: true
        type: string
    secrets:
      pat_token:
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  test:
    name: ${{ inputs.test_type == 'integration' && 'Integration Tests' || 'Unit Tests' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.pat_token }}

    steps:
      # Checkout and setup
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up NPM
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        
      - name: Run unit tests
        if: ${{ inputs.test_type == 'unit' }}
        run: ./gradlew :laa-amend-a-claim-ui:test :laa-amend-a-claim-ui:jacocoTestCoverageVerification
        env:
          GITHUB_TOKEN: ${{ secrets.pat_token }}

      - name: Integration test
        if: ${{ inputs.test_type == 'integration' }}
        run: ./gradlew :laa-amend-a-claim-ui:integrationTest
        env:
          GITHUB_TOKEN: ${{ secrets.pat_token }}

      # Upload artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.test_type }}-test-results
          path: laa-amend-a-claim-ui/build/test-results/${{ inputs.test_type == 'integration' && 'integrationTest' || 'test' }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkstyle-report
          path: laa-amend-a-claim-ui/build/reports/checkstyle
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.test_type }}-test-report
          path: laa-amend-a-claim-ui/build/reports/tests/${{ inputs.test_type == 'integration' && 'integrationTest' || 'test' }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload jacoco coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.test_type }}-jacoco-coverage-report
          path: laa-amend-a-claim-ui/build/reports/jacoco
          retention-days: 14
          if-no-files-found: warn
