name: E2E tests

on:
  workflow_call:
    secrets:
      pat_token:
        required: true
      kube_cert_submit_a_bulk_claim_uat:
        required: true
      kube_cluster_submit_a_bulk_claim_uat:
        required: true
      kube_namespace_submit_a_bulk_claim_uat:
        required: true
      kube_token_submit_a_bulk_claim_uat:
        required: true
      kube_namespace_laa_fee_scheme_api_uat:
        required: true
      kube_cert_laa_fee_scheme_api_uat:
        required: true
      kube_token_laa_fee_scheme_api_uat:
        required: true
      kube_cluster_laa_fee_scheme_api_uat:
        required: true
      fsp_api_token:
        required: true
      pda_api_token:
        required: true
      azure_client_id:
        required: true
      azure_client_secret:
        required: true
      azure_tenant_id:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout laa-data-claims-parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ministryofjustice/laa-data-claims-parent
          path: laa-data-claims-parent
          submodules: "true"

      - name: Update parent submodules
        working-directory: laa-data-claims-parent
        env:
          AMEND_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          ./update-bulk-claim-repos.sh
          cd laa-amend-a-claim
          git fetch origin "$AMEND_REF"
          git checkout -B "$AMEND_REF" FETCH_HEAD

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.29.4

      - name: Authenticate to SaBC cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@768f673017edbb793cf052fa159c272d6c1f9177
        with:
          kube-cert: ${{ secrets.kube_cert_submit_a_bulk_claim_uat }}
          kube-cluster: ${{ secrets.kube_cluster_submit_a_bulk_claim_uat }}
          kube-namespace: ${{ secrets.kube_namespace_submit_a_bulk_claim_uat }}
          kube-token: ${{ secrets.kube_token_submit_a_bulk_claim_uat }}
          kube-sa: deploy-user

      - name: Port forward to PDA-API service in SaBC namespace
        uses: ./.github/actions/port-forward-service
        with:
          kube_namespace: ${{ secrets.kube_namespace_submit_a_bulk_claim_uat }}
          service_name: "uat-e2e-testing-pda-proxy"
          local_port: "8186"
          remote_port: "8080"
          pid_env_var: PORT_FORWARD_PDA_PID
          wait_label: pda-api

      - name: Authenticate to FSP cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@768f673017edbb793cf052fa159c272d6c1f9177
        with:
          kube-cert: ${{ secrets.kube_cert_laa_fee_scheme_api_uat }}
          kube-token: ${{ secrets.kube_token_laa_fee_scheme_api_uat }}
          kube-cluster: ${{ secrets.kube_cluster_laa_fee_scheme_api_uat }}
          kube-namespace: ${{ secrets.kube_namespace_laa_fee_scheme_api_uat }}
          kube-sa: deploy-user

      - name: Port forward to FPS-API service in FSP namespace
        uses: ./.github/actions/port-forward-service
        with:
          kube_namespace: ${{ secrets.kube_namespace_laa_fee_scheme_api_uat }}
          service_name: "laa-fee-scheme-api-service"
          local_port: "8095"
          remote_port: "8085"
          pid_env_var: PORT_FORWARD_FSP_PID
          wait_label: fsp-api

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install E2E dependencies
        working-directory: laa-data-claims-parent/laa-amend-a-claim/e2e
        run: npm ci

      - name: Build and start services
        working-directory: laa-data-claims-parent
        run: |
          task assemble:amend
          task assemble:api
          docker compose up --build -d claims-api amend-redis postgres amend-ui
        env:
          GITHUB_TOKEN: ${{ secrets.pat_token }}
          FEE_SCHEME_PLATFORM_API_URL: "http://host.docker.internal:8095"
          FEE_SCHEME_PLATFORM_API_ACCESS_TOKEN: ${{ secrets.fsp_api_token }}
          PROVIDER_DETAILS_API_URL: "http://host.docker.internal:8186"
          PROVIDER_DETAILS_API_HOSTNAME: "http://host.docker.internal:8186"
          PROVIDER_DETAILS_API_ACCESS_TOKEN: ${{ secrets.pda_api_token }}
          AMEND_UI_SPRING_PROFILES_ACTIVE: e2e
          AMEND_SILAS_CLIENT_ID: ${{ secrets.azure_client_id }}
          AMEND_SILAS_CLIENT_SECRET: ${{ secrets.azure_client_secret }}
          AMEND_SILAS_TENANT_ID: ${{ secrets.azure_tenant_id }}
          CLAIMS_API_AMENDMENTS_ENABLED: true

      - name: Wait for services to be ready
        working-directory: laa-data-claims-parent/laa-amend-a-claim
        run: ./.github/scripts/wait-for-services.sh

      - name: Run E2E Tests
        working-directory: laa-data-claims-parent/laa-amend-a-claim
        run: ./gradlew :e2e:test --no-configuration-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SILAS_AUTH_ENABLED: false
          UI_BASE_URL: http://localhost:8090
          DB_CONNECTION_URL: jdbc:postgresql://localhost:5432/laa_data_claims_api_dev
          DB_USER: user
          DB_PASSWORD: dev

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          docker logs amend-a-claim-app > logs/amend.log 2>&1 || true
          docker logs data-claims-api-app > logs/claims-api.log 2>&1 || true
          docker logs local-postgres > logs/postgres.log 2>&1 || true
          docker logs amend-redis > logs/amend-redis.log 2>&1 || true
          cat pf-8095.log > logs/pf-fsp.log 2>&1 || true
          cat pf-8186.log > logs/pf-pda.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tests-docker-logs
          path: logs
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tests-reports
          path: |
            laa-data-claims-parent/laa-amend-a-claim/e2e/build/allure-results
            laa-data-claims-parent/laa-amend-a-claim/e2e/build/reports
            laa-data-claims-parent/laa-amend-a-claim/e2e/build/test-results
            laa-data-claims-parent/laa-amend-a-claim/e2e/build/axe-reports
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        working-directory: laa-data-claims-parent
        run: |
          set +e
          task down
          [ -n "${PORT_FORWARD_FSP_PID:-}" ] && kill "${PORT_FORWARD_FSP_PID}" || true
          [ -n "${PORT_FORWARD_PDA_PID:-}" ] && kill "${PORT_FORWARD_PDA_PID}" || true
          true
